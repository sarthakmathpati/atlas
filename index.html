<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Atlas: a personal study map for cracking SDE and quant interviews."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>"
    />
    <title>Atlas</title>
    <script>
      // Apply the saved theme before the first paint so there is never a flash of the wrong theme.
      // "system" (the default) leaves data-theme unset and lets prefers-color-scheme decide.
      (function () {
        try {
          var t = localStorage.getItem("atlas.theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          /* storage can be blocked; the system theme is used */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
