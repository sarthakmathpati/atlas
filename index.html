<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Atlas: a personal study map for cracking SDE and quant interviews."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>"
    />
    <title>Atlas</title>
    <script>
      // Show the right theme before the first paint, so there is never a flash of the wrong one
      // (BUILD_SPEC.md 12.10.2). data-theme is always day, dusk or night: System follows the
      // device, "schedule" picks by the local time. Mirrors src/lib/theme.ts (tested).
      (function () {
        var choice = "system";
        var schedule = null;
        try {
          choice = localStorage.getItem("atlas.theme") || "system";
          schedule = JSON.parse(localStorage.getItem("atlas.themeSchedule") || "null");
        } catch (e) {
          /* storage can be blocked; the device's theme is used */
        }
        if (choice === "light") choice = "day";
        if (choice === "dark") choice = "night";
        var theme = choice;
        if (choice === "schedule") {
          var defaults = { day: "06:30", dusk: "19:00", night: "22:30" };
          var names = ["day", "dusk", "night"];
          var starts = [];
          for (var i = 0; i < 3; i++) {
            var t = schedule && schedule[names[i]];
            var m = typeof t === "string" && /^([01]\d|2[0-3]):([0-5]\d)$/.exec(t);
            if (!m) m = /^(\d\d):(\d\d)$/.exec(defaults[names[i]]);
            starts.push({ name: names[i], minute: Number(m[1]) * 60 + Number(m[2]), order: i });
          }
          starts.sort(function (a, b) {
            return a.minute - b.minute || a.order - b.order;
          });
          var now = new Date();
          var minute = now.getHours() * 60 + now.getMinutes();
          theme = starts[2].name;
          for (var j = 0; j < 3; j++) if (starts[j].minute <= minute) theme = starts[j].name;
        } else if (choice !== "day" && choice !== "dusk" && choice !== "night") {
          var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          theme = dark ? "night" : "day";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
      // ADHD mode (F32): the parts that are on, so the calm screen shows from the first paint.
      // Mirrors src/lib/adhd/prefs.ts (tested).
      (function () {
        var raw = null;
        try {
          raw = localStorage.getItem("atlas.adhd");
        } catch (e) {
          return;
        }
        if (typeof raw !== "string") return;
        var known = [
          "calm",
          "nowCard",
          "time",
          "place",
          "rewards",
          "breaks",
          "startHelp",
          "reading",
          "gentle",
        ];
        var parts = raw.split(/\s+/).filter(function (p) {
          return known.indexOf(p) >= 0;
        });
        document.documentElement.setAttribute("data-adhd", parts.join(" "));
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
